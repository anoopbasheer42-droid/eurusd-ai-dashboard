
name: Update EUR/USD Data

on:
  schedule:
    - cron: '0 * * * *' # Runs at the top of every hour
  workflow_dispatch: # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas pandas-ta-classic fxnewsbias groq

      - name: Run data script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FXNEWSBIAS_API_KEY: ${{ secrets.FXNEWSBIAS_API_KEY }}
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Update EUR/USD live data with full rules" || echo "No changes to commit"
          git push
