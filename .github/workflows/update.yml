name: Update EUR/USD Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install core dependencies (required)
        run: |
          pip install --upgrade pip
          pip install yfinance pandas

      - name: Install optional dependencies (may skip)
        run: |
          pip install pandas-ta-classic || echo "Skipping pandas-ta-classic"
          pip install groq || echo "Skipping groq"
          pip install fxnewsbias || echo "Skipping fxnewsbias"

      - name: Run data script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FXNEWSBIAS_API_KEY: ${{ secrets.FXNEWSBIAS_API_KEY }}
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Update EUR/USD live data" || echo "No changes to commit"
          git push
