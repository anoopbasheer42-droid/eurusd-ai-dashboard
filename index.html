<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>EUR/USD AI Pro Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8a94a6;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --red: #e74c3c;
            --blue: #4a90e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a2333 0%, var(--bg) 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container to mimic mobile dashboard */
        .dashboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--yellow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 204, 113, 0.15);
            color: var(--green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
            animation: pulse 2s infinite;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            z-index: 2;
            position: relative;
        }

        /* Neural Core 3D Canvas */
        #canvas-container {
            width: 100%;
            height: 250px;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 10px;
            z-index: 2;
            position: relative;
        }

        /* Signal Card */
        .signal-card {
            text-align: center;
            padding: 30px 20px;
        }

        #signal-text {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--yellow);
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            transition: all 0.5s ease-in-out;
            z-index: 2;
            position: relative;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Header -->
        <header>
            <div class="logo">
                ⚡ EUR/USD <span>AI PRO</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                MARKET OPEN
            </div>
        </header>

        <!-- Neural Core Card -->
        <div class="card">
            <div class="card-title">AI Neural Core</div>
            <div id="canvas-container"></div>
            <div class="subtitle">QUANTUM MARKET INTELLIGENCE</div>
        </div>

        <!-- Signal Card -->
        <div class="card signal-card">
            <div class="card-title">Current Signal</div>
            <div id="signal-text">WAITING</div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. THREE.JS NEURAL CORE ANIMATION ---
        const container = document.getElementById('canvas-container');
        
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Create the "Neural Core" (Wireframe Icosahedron)
        const geometry = new THREE.IcosahedronGeometry(1.8, 2);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x4a90e2, 
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        // Add floating particles around the core
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 8;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x4a90e2,
            transparent: true,
            opacity: 0.6
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate core
            core.rotation.x += 0.003;
            core.rotation.y += 0.005;
            
            // Rotate particles opposite direction
            particlesMesh.rotation.x -= 0.001;
            particlesMesh.rotation.y -= 0.002;

            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });


        // --- 2. SIMULATED TRADING SIGNAL LOGIC ---
        // Since GitHub Pages is static, we simulate the AI making decisions.
        const signalText = document.getElementById('signal-text');
        
        const signals = [
            { text: 'WAITING', color: '#f1c40f', shadow: 'rgba(241, 196, 15, 0.5)' },
            { text: 'BUY', color: '#2ecc71', shadow: 'rgba(46, 204, 113, 0.6)' },
            { text: 'SELL', color: '#e74c3c', shadow: 'rgba(231, 76, 60, 0.6)' },
            { text: 'WAITING', color: '#f1c40f', shadow: 'rgba(241, 196, 15, 0.5)' }
        ];

        let signalIndex = 0;

        // Change the signal every 5 seconds to simulate live trading
        setInterval(() => {
            signalIndex = (signalIndex + 1) % signals.length;
            const currentSignal = signals[signalIndex];
            
            signalText.innerText = currentSignal.text;
            signalText.style.color = currentSignal.color;
            signalText.style.textShadow = `0 0 30px ${currentSignal.shadow}`;
            
            // Add a quick scale animation when the signal changes
            signalText.style.transform = 'scale(1.1)';
            setTimeout(() => {
                signalText.style.transform = 'scale(1)';
            }, 200);

        }, 5000); // 5000ms = 5 seconds
    </script>
</body>
</html>
