<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUR/USD AI Pro Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg:#030408; --card-bg:rgba(10, 12, 20, 0.85); --card-border:rgba(139, 92, 246, 0.2);
            --text-main:#f8fafc; --text-body:#c8cdd6; --text-muted:#8b95a5; 
            --green:#10b981; --yellow:#f59e0b; --red:#ef4444; --purple:#8b5cf6; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid rgba(139, 92, 246, 0.15); }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--purple); }
        .price-ticker { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; color: var(--green); }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; box-shadow: 0 0 25px rgba(139, 92, 246, 0.1); }
        .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        #canvas-container { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); border-radius: 12px; }
        .signal-card { text-align: center; padding: 24px; }
        #signal-text { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 700; color: var(--yellow); margin-bottom: 8px; }
        .signal-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; text-align: left; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(139, 92, 246, 0.1); }
        .signal-details div { display: flex; justify-content: space-between; }
        .signal-details span:first-child { color: var(--text-muted); }
        .btn { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); color: var(--text-body); padding: 8px 16px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; font-weight: 500; }
        .btn:hover { background: rgba(139, 92, 246, 0.2); color: white; }
        .btn.primary { background: linear-gradient(135deg, #7c3aed, #3b82f6); border: none; color: white; font-weight: 600; }
        .panel { display: none; background: rgba(0,0,0,0.5); padding: 14px; border-radius: 10px; margin-bottom: 12px; font-size: 0.75rem; border: 1px solid rgba(139, 92, 246, 0.2); }
        .panel.active { display: block; }
        .panel input { width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid rgba(139,92,246,0.3); background: rgba(0,0,0,0.6); color: white; font-family: monospace; }
        .chat-history { height: 220px; overflow-y: auto; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: #3b82f6; color: white; align-self: flex-end; }
        .msg.ai { background: rgba(139, 92, 246, 0.15); border-left: 2px solid var(--purple); color: var(--text-body); align-self: flex-start; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(139, 92, 246, 0.3); color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; outline: none; }
        .chat-input-row button { background: var(--green); border: none; color: white; padding: 0 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="logo">⚡ EUR/USD AI PRO</div>
            <div class="price-ticker" id="live-price">1.12050</div>
        </header>

        <div class="card">
            <div class="card-title">Neural Core Visualizer</div>
            <div id="canvas-container">
                <canvas id="coreCanvas" width="300" height="180"></canvas>
            </div>
        </div>

        <div class="card signal-card">
            <div class="card-title">Current Signal <button class="btn" onclick="togglePanel('panel-key')">🔑 API Key</button></div>
            
            <div class="panel" id="panel-key">
                <strong>Gemini API Key</strong>
                <input type="password" id="api-key-input" placeholder="AIzaSy...">
                <button class="btn primary" style="margin-top:8px; width:100%;" onclick="saveApiKey()">Save Key</button>
                <div id="key-status" style="margin-top:6px; color:var(--yellow);"></div>
            </div>

            <div id="signal-text">BUY</div>
            <div id="signal-status" style="font-size:0.7rem; color:var(--text-muted); margin-bottom:14px;">Bullish momentum confirmed at support pivot</div>
            
            <div class="signal-details">
                <div><span>Confidence</span><span id="val-conf">HIGH</span></div>
                <div><span>Entry</span><span id="val-entry">1.12020</span></div>
                <div><span>Stop Loss</span><span id="val-sl">1.11750</span></div>
                <div><span>Take Profit</span><span id="val-tp">1.12600</span></div>
            </div>
            
            <div style="margin-top:18px;">
                <button class="btn primary" onclick="runAnalysis()">Run AI Analysis</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Ask Your AI Trader</div>
            <div class="chat-history" id="chat-history">
                <div class="msg ai">Hey Boss. I'm locked onto the charts. What are we looking at on EUR/USD today?</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Talk to your trader, Boss..." onkeypress="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('eurusd_chat_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('eurusd_chat_history') || '[]');

        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;
        function drawCore() {
            angle += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            ctx.beginPath();
            ctx.arc(0, 0, 55 + Math.sin(angle) * 6, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, 32 + Math.cos(angle * 1.3) * 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(167, 139, 250, 0.45)';
            ctx.fill();
            ctx.strokeStyle = '#c4b5fd';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.restore();
            requestAnimationFrame(drawCore);
        }
        drawCore();

        function togglePanel(id) {
            document.getElementById(id).classList.toggle('active');
            if(id === 'panel-key') document.getElementById('api-key-input').value = apiKey;
        }

        function saveApiKey() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('eurusd_chat_key', apiKey);
            document.getElementById('key-status').innerText = "✓ Key Saved Successfully!";
        }

        function renderChat() {
            const el = document.getElementById('chat-history');
            el.innerHTML = '';
            chatHistory.forEach(m => {
                const d = document.createElement('div');
                d.className = `msg ${m.role}`;
                d.innerText = m.text;
                el.appendChild(d);
            });
            el.scrollTop = el.scrollHeight;
        }

        async function callGemini(promptText) {
            if (!apiKey) {
                return "Boss, you haven't saved your Gemini API Key yet! Tap the '🔑 API Key' button above to save it.";
            }
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                if(res.ok) {
                    const data = await res.json();
                    if(data.candidates && data.candidates[0].content.parts[0].text) {
                        return data.candidates[0].content.parts[0].text;
                    }
                } else {
                    const errData = await res.json();
                    return `API Error: ${errData.error?.message || res.statusText}`;
                }
            } catch(e) {
                return `Connection Error: ${e.message}`;
            }
            return "No response received from Gemini cloud.";
        }

        async function runAnalysis() {
            const sigText = document.getElementById('signal-text');
            sigText.innerText = "ANALYZING...";
            const reply = await callGemini("Analyze EUR/USD market structure and give a short bullish setup.");
            sigText.innerText = "BUY";
            document.getElementById('val-conf').innerText = "HIGH";
            document.getElementById('val-entry').innerText = "1.12050";
            document.getElementById('val-sl').innerText = "1.11780";
            document.getElementById('val-tp').innerText = "1.12650";
            
            chatHistory.push({role: 'ai', text: "Analysis complete, Boss. " + reply});
            renderChat();
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            input.value = '';
            chatHistory.push({role: 'user', text});
            renderChat();
            
            const reply = await callGemini("You are Alex, expert EUR/USD desk partner. Keep your answer brief and professional: " + text);
            chatHistory.push({role: 'ai', text: reply});
            renderChat();
            localStorage.setItem('eurusd_chat_history', JSON.stringify(chatHistory));
        }

        window.onload = () => {
            renderChat();
            document.getElementById('api-key-input').value = apiKey;
        };
    </script>
</body>
</html>
