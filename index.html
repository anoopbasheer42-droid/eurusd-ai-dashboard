<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>EUR/USD AI Pro Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #8a94a6;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --red: #e74c3c;
            --blue: #4a90e2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a2333 0%, var(--bg) 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo span { color: var(--yellow); }

        .price-ticker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--green);
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 15px 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            z-index: 2;
            position: relative;
        }

        /* Neural Core 3D Canvas */
        #canvas-container {
            width: 100%;
            height: 180px;
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        .subtitle {
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 5px;
            z-index: 2;
            position: relative;
        }

        /* Signal Card */
        .signal-card {
            text-align: center;
            padding: 20px;
        }

        #signal-text {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--yellow);
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            transition: all 0.4s ease-in-out;
            z-index: 2;
            position: relative;
        }

        /* AI Log */
        .log-container {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--blue);
            height: 60px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        .log-entry {
            margin-bottom: 4px;
            opacity: 0.8;
            animation: fadeIn 0.3s ease-in;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85rem;
        }

        .stat-item {
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }

        .stat-label { color: var(--text-muted); }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 0.8; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <div class="logo">⚡ EUR/USD <span>AI PRO</span></div>
            <div class="price-ticker" id="live-price">1.08500</div>
        </header>

        <!-- Neural Core Card -->
        <div class="card">
            <div class="card-title">AI Neural Core</div>
            <div id="canvas-container"></div>
            <div class="subtitle">QUANTUM MARKET INTELLIGENCE</div>
        </div>

        <!-- Signal Card -->
        <div class="card signal-card">
            <div class="card-title">Current Signal</div>
            <div id="signal-text">WAITING</div>
        </div>

        <!-- AI Insights Card -->
        <div class="card">
            <div class="card-title">Neural Network Logs</div>
            <div class="log-container" id="ai-log">
                <div class="log-entry">> Initializing AI core...</div>
            </div>
        </div>

        <!-- Performance Stats Card -->
        <div class="card">
            <div class="card-title">Performance Details</div>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-label">Win Rate</span><span id="win-rate" style="color:var(--yellow)">0%</span></div>
                <div class="stat-item"><span class="stat-label">Total Trades</span><span id="total-trades">0</span></div>
                <div class="stat-item"><span class="stat-label">Wins</span><span id="win-count" style="color:var(--green)">0</span></div>
                <div class="stat-item"><span class="stat-label">Losses</span><span id="loss-count" style="color:var(--red)">0</span></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. THREE.JS NEURAL CORE ANIMATION ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(1.5, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x4a90e2, wireframe: true, transparent: true, opacity: 0.8 });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 300;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 7; }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.03, color: 0x4a90e2, transparent: true, opacity: 0.6 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        function animate() {
            requestAnimationFrame(animate);
            core.rotation.x += 0.003; core.rotation.y += 0.005;
            particlesMesh.rotation.x -= 0.001; particlesMesh.rotation.y -= 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 2. LIVE PRICE SIMULATION ---
        let currentPrice = 1.08500;
        const priceElement = document.getElementById('live-price');
        
        setInterval(() => {
            // Random price movement up or down
            const change = (Math.random() - 0.5) * 0.00030;
            currentPrice += change;
            
            // Format to 5 decimal places
            priceElement.innerText = currentPrice.toFixed(5);
            
            // Change color based on last movement
            if (change > 0) {
                priceElement.style.color = 'var(--green)';
                priceElement.style.borderColor = 'rgba(46, 204, 113, 0.3)';
            } else {
                priceElement.style.color = 'var(--red)';
                priceElement.style.borderColor = 'rgba(231, 76, 60, 0.3)';
            }
        }, 1500); // Updates every 1.5 seconds

        // --- 3. AI LOG SIMULATION ---
        const logs = [
            "> Scanning order blocks...",
            "> Analyzing liquidity zones...",
            "> RSI divergence detected.",
            "> Volume spike identified.",
            "> Calculating Fibonacci retracement...",
            "> Neural net confidence: 87%",
            "> Waiting for candle close...",
            "> Market structure shifting..."
        ];
        const logContainer = document.getElementById('ai-log');

        setInterval(() => {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerText = logs[Math.floor(Math.random() * logs.length)];
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Keep only last 3 logs
            if (logContainer.children.length > 3) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }, 3000);

        // --- 4. TRADING SIGNAL & WIN/LOSS TRACKING ---
        const signalText = document.getElementById('signal-text');
        const winRateEl = document.getElementById('win-rate');
        const totalTradesEl = document.getElementById('total-trades');
        const winCountEl = document.getElementById('win-count');
        const lossCountEl = document.getElementById('loss-count');

        let stats = { total: 0, wins: 0, losses: 0 };

        function updateStats(isWin) {
            stats.total++;
            if (isWin) stats.wins++;
            else stats.losses++;
            
            totalTradesEl.innerText = stats.total;
            winCountEl.innerText = stats.wins;
            lossCountEl.innerText = stats.losses;
            
            const winRate = stats.total === 0 ? 0 : Math.round((stats.wins / stats.total) * 100);
            winRateEl.innerText = winRate + '%';
        }

        function generateSignal() {
            const rand = Math.random();
            let signal, color, shadow;
            
            if (rand < 0.4) {
                signal = 'BUY'; color = '#2ecc71'; shadow = 'rgba(46, 204, 113, 0.6)';
            } else if (rand < 0.8) {
                signal = 'SELL'; color = '#e74c3c'; shadow = 'rgba(231, 76, 60, 0.6)';
            } else {
                signal = 'WAITING'; color = '#f1c40f'; shadow = 'rgba(241, 196, 15, 0.5)';
            }

            signalText.innerText = signal;
            signalText.style.color = color;
            signalText.style.textShadow = `0 0 30px ${shadow}`;
            signalText.style.transform = 'scale(1.1)';
            
            setTimeout(() => { signalText.style.transform = 'scale(1)'; }, 200);

            // If it's a real trade, simulate the win/loss after 5 seconds
            if (signal === 'BUY' || signal === 'SELL') {
                setTimeout(() => {
                    // 60% win rate simulation
                    const isWin = Math.random() < 0.6; 
                    updateStats(isWin);
                    
                    const resultLog = document.createElement('div');
                    resultLog.className = 'log-entry';
                    resultLog.style.color = isWin ? 'var(--green)' : 'var(--red)';
                    resultLog.innerText = `> Trade ${signal} closed: ${isWin ? 'WIN 🟢' : 'LOSS 🔴'}`;
                    logContainer.appendChild(resultLog);
                    if (logContainer.children.length > 3) logContainer.removeChild(logContainer.firstChild);
                }, 5000);
            }
        }

        // Generate a new signal every 8 seconds
        setInterval(generateSignal, 8000);
        generateSignal(); // Initial run
    </script>
</body>
</html>
